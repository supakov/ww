name: CI

# CI runs on demand alone, with the word of the owner (AGENTS.md, section 4): the checks on Linux
# for Windows first, then on Windows the tests, the release builds of the workspace and of the
# plugin of stable Rust, the plugin in C built by the compiler of Visual Studio, the demo listing
# and drawing its plugins without a window, and the archive of the demo. checks=false leaves out
# the Linux job (its checks ran on the computer of the developer).
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "Run the Linux checks first (format, clippy for Windows)"
        type: boolean
        default: true

# The token of a run reads the repository and nothing else: no job writes to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format and clippy (Linux, for Windows)
    if: inputs.checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: |
          cargo fmt --all --check
          cd examples/ww-grey && cargo fmt --check
      - name: Clippy (the workspace, checked for Windows)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Clippy of the plugin of stable Rust
        working-directory: examples/ww-grey
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Clippy of W# for the browser
        run: cargo clippy -p ww --no-default-features --features glow --target wasm32-unknown-unknown -- -D warnings
      - name: Tests of ww-base
        run: cargo test -p ww-base

  windows:
    name: Tests, the demo and its plugins (Windows)
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The release builds
        # build-all.cmd builds the workspace, the plugin of stable Rust apart (its RUSTFLAGS link
        # std and the C runtime in) and the plugin in C with the cl vswhere finds (/MT), and packs
        # dist\ww-demo with the std-<hash>.dll the demo imports.
        shell: cmd
        run: build-all.cmd < NUL
      - name: The demo lists its plugins and draws them without a window
        shell: pwsh
        run: |
          $demo = "dist\ww-demo\ww-demo.exe"
          $list = & $demo --plugins | Out-String
          Write-Output $list
          foreach ($name in "Hello, the template of a plugin", "Mandelbrot set (C)", "Bytes as a picture (stable Rust)", "Bundles of parts", "Texts") {
            if (-not $list.Contains($name)) { throw "the plugin $name is not loaded" }
          }
          if ($list.Contains("not loaded")) { throw "a DLL of the folder plugins did not load" }
          & $demo --probe dist\ww-demo\samples\seahorse.mandel
          if ($LASTEXITCODE -ne 0) { throw "the plugin in C did not draw" }
          & $demo --probe dist\ww-demo\samples\demo.wwbundle
          if ($LASTEXITCODE -ne 0) { throw "the bundle did not draw" }
          & $demo --probe dist\ww-demo\wwrt.dll
          if ($LASTEXITCODE -ne 0) { throw "the plugin of any bytes did not draw" }
      - name: The tools of the plugins over MCP without a window (stdio)
        # The release loads the native template, the plugin in C and the one of stable Rust, and
        # answers a client on stdio: the list of the tools and a call of a tool of each.
        shell: pwsh
        run: |
          $demo = "dist\ww-demo\ww-demo.exe"
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"clientInfo":{"name":"ci"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"mandelbrot_escape","arguments":{"x":-1,"y":0}}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"mandelbrot_ascii","arguments":{"width":40,"height":12}}}',
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"grey_cache","arguments":{}}}',
            '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"hello_greet","arguments":{"name":"CI"}}}'
          ) -join "`n"
          $out = $requests | & $demo --mcp stdio | Out-String
          Write-Output $out
          foreach ($want in '"mandelbrot_escape"', '"grey_cache"', '"hello_greet"', '\"inside\": true', 'Hello, CI', '\"budget\"', '\"lines\"') {
            if (-not $out.Contains($want)) { throw "the answer of MCP lacks $want" }
          }
          if ($out.Contains('"isError":true')) { throw "a tool failed" }
      - name: The window draws (OpenGL or DirectX 12 on WARP)
        shell: pwsh
        run: |
          & dist\ww-demo\ww-demo.exe --smoke-window
          if ($LASTEXITCODE -ne 0) { throw "no renderer started" }
      - uses: actions/upload-artifact@v4
        with:
          name: ww-demo
          path: dist/ww-demo-*.zip
