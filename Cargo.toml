# W# (ww): the framework of the window of programs with document tabs, and the system of their
# plugins (wwrt, the stable interface ww.h and its crate ww-stable), with the examples of a plugin
# and of a program (examples/). The programs take it as a git dependency of the branch main
# (README.md).
[workspace]
resolver = "3"
members = [
    "crates/ww-base",
    "crates/ww",
    "crates/wwrt",
    "crates/wwmcp",
    "stable/rust",
    "examples/ww-hello",
    "examples/ww-demo",
]
# A plugin of the stable interface is built apart, without the flags of the native family.
exclude = ["examples/ww-grey"]

[workspace.package]
version = "0.1.50"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/supakov/ww"
authors = ["digidult"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

# wwrt is a Rust dylib (docs/plugins.md): no LTO, which rustc runs for executables, cdylibs and
# static libraries alone. The profiles of a dependency are not the ones of a program: each program
# names its own.
[profile.release]
lto = false
codegen-units = 1
strip = true

# A debug build keeps the dependencies and the runtime optimized: at opt-level 2 a crate exports no
# shared instances of generic functions, which put 128973 symbols into a debug wwrt.dll, twice the
# 65535 a DLL holds (docs/plugins.md).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.wwrt]
opt-level = 2
